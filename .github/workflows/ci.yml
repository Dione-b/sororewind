name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly: the live-RPC replay check and the advisory database. The rest
    # only changes when the code does.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints, tests, snapshots, docs and MSRV; see checks.yml.
  checks:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/checks.yml

  replay-action:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/replay
        with:
          version: v0.2.0
          fixture: fixtures/contract-error

  # Compare on the same runner to keep hardware variation out of the baseline.
  benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Compare offline replay benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo fetch --locked
          if git cat-file -e "$BASE_SHA:benches/replay.rs" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
            (cd "$RUNNER_TEMP/base" && cargo fetch --locked && cargo bench --locked --offline --bench replay -- --save-baseline base)
            cargo bench --locked --offline --bench replay -- --baseline-lenient base 2>&1 | tee benchmark-results.txt
          else
            cargo bench --locked --offline --bench replay -- --save-baseline base 2>&1 | tee benchmark-results.txt
          fi
          if grep -q 'Performance has regressed' benchmark-results.txt; then
            echo "::warning::Replay benchmarks regressed beyond the 15% noise threshold."
            echo 'Criterion reported a replay regression above 15%. See the job log for affected stages.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-replay-benchmarks
          path: |
            benchmark-results.txt
            target/criterion

  # Advisories, licences, banned crates and sources; see deny.toml. Nightly
  # too: an advisory can be published against an unchanged lockfile.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  # Replays recent failed testnet transactions against the live RPC. Not run
  # on push or PR, so an RPC outage cannot fail unrelated changes.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Optimised: the test times each replay, and the hosts interpret WASM.
      - run: cargo test --release --locked --test live -- --ignored --nocapture

  # A scheduled run has no author to notify, so a failure opens an issue (or
  # comments on the one already open): a network moving past the embedded
  # protocols must not go unnoticed.
  report-nightly-failure:
    if: ${{ always() && github.event_name == 'schedule' && (needs.live.result == 'failure' || needs.deny.result == 'failure') }}
    needs: [live, deny]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Nightly CI is failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BODY: |
        The scheduled CI run failed (live: ${{ needs.live.result }}, deny: ${{ needs.deny.result }}).

        If the live job failed on `no_network_is_ahead_of_the_embedded_hosts`, a network has
        upgraded its protocol: see CONTRIBUTING.md, "Protocol upgrades".
    steps:
      - run: |
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY

          Run: $RUN_URL"
          fi
